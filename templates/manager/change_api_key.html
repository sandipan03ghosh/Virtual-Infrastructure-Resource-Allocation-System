{% extends 'partials/base.html' %} {% block title %} Change API Key {% endblock %}
{% block content %}
<div class="mx-auto max-w-6xl px-4">
  <!-- Using 'container-lg' for larger container -->
  <div class="flex flex-wrap -mx-2 my-4">
    <div class="w-full lg:w-2/3 px-2 lg:ml-[16.6667%]">
      <!-- Using 'col-lg-8' for larger column -->
      <div class="border border-gray-300 bg-white p-4">
        <!-- Increased padding -->
        <h3 class="mb-4">Update Gemini API Key</h3>
        <!-- Increased margin bottom -->
        <hr />
        {% comment %} a textbox to enter new api key {% endcomment %}
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <input
              type="text"
              class="w-full rounded border-gray-300 px-3 py-2"
              name="api_key"
              placeholder="Enter your API key here"
            />
          </div>
          <button class="inline-block px-4 py-2 rounded font-medium text-white bg-blue-600 hover:bg-blue-700" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
