{% extends 'partials/base.html'%}
{% block title %} Edit Information Page {% endblock %}
{% load crispy_forms_tags %}
{% block content %}
<div class="mx-auto max-w-6xl px-4">
    <div class="flex flex-wrap -mx-2 my-4">
        <div class="w-full md:w-1/2 px-2 md:ml-[25%]">
            <div class="rounded-lg shadow border border-gray-200 bg-white">
                <div class="bg-white text-gray-900 border-b border-gray-200 px-4 py-2 rounded-t-lg">
                    <h2 class="text-center">Platform Status Notice</h2>
                </div>
                <div class="p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form |crispy }}
                        <button class="block w-full text-center px-4 py-2 rounded font-medium text-white bg-green-600 hover:bg-green-700" type="submit">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
