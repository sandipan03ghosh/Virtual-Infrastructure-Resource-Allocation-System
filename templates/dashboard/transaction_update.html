{% extends 'partials/base.html'%} {% block title %} Edit Transaction {% endblock%} 
{% block content %} {% load crispy_forms_tags %}
<div class="mx-auto max-w-6xl px-4">
  <div class="flex flex-wrap -mx-2 my-4">
    <div class="w-full md:w-1/2 px-2 md:ml-[25%]">
      <div class="border border-gray-300 bg-white p-3">
        <h3>Update Transaction State</h3>
        <hr />

        <form method="POST">
          {% csrf_token %} {{ form|crispy }}
          <a class="inline-block px-4 py-2 rounded font-medium text-white bg-gray-500 hover:bg-gray-600" href="{% url 'dashboard-resource' %}"
            >Cancel</a
          >
          <input class="inline-block px-4 py-2 rounded font-medium text-white bg-blue-600 hover:bg-blue-700" type="submit" value="update" />
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
