{% extends 'partials/base.html' %} {% block title %} Password Reset Page {%endblock %} 
{% load crispy_forms_tags %} 
{% block content %}
<div class="mx-auto max-w-6xl px-4">
  <div class="flex flex-wrap -mx-2 mt-5">
    <div class="w-full md:w-1/2 px-2 md:ml-[25%]">
      {% for message in messages %} {% if message %}
      <div class="alert alert-{{message.tags}}">{{message}}</div>
      {% endif %} {% endfor %}
      <div class="border border-gray-300 p-3 bg-white">
        <h3>Password Reset Page</h3>
        <hr />
        <form method="POST">
          {% csrf_token %} {{ form|crispy }}
          <input class="inline-block px-4 py-2 rounded font-medium text-white bg-blue-600 hover:bg-blue-700" type="submit" value="Reset Password" />
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
