{% extends 'staff/staff_base.html' %} 
{% block title %} Profile Page {% endblock%} 
{% block content %}
<!--Table-->
<div class="mx-auto max-w-6xl px-4">
  <div class="flex flex-wrap -mx-2 my-4">
    <div class="w-full md:w-1/3 px-2"></div>
    <div class="w-full md:w-2/3 px-2">
      <div class="rounded-lg shadow border border-gray-200 bg-white">
        <div class="bg-blue-600 text-white px-4 py-2 rounded-t-lg">Profile Page</div>
        <div class="p-4">
          <div class="flex flex-wrap -mx-2">
            <div class="w-full md:w-2/3 px-2">
              <span class="text-2xl font-semibold"> Profile Information</span>
              <a
                class="inline-block px-3 py-1 text-sm rounded font-medium text-white bg-blue-600 hover:bg-blue-700 float-right"
                href="{% url 'user-profile-update' %}"
                >Edit</a
              >
              <hr />
              <table class="w-full text-left bg-white">
                <tbody>
                  <tr>
                    <th class="px-2 py-1" scope="row">Name</th>
                    <td class="px-2 py-1">{{ user.username}}</td>
                  </tr>
                  <tr>
                    <th class="px-2 py-1" scope="row">Email</th>
                    <td class="px-2 py-1">{{user.email }}</td>
                  </tr>
                  <tr>
                    <th class="px-2 py-1" scope="row">Phone</th>
                    <td class="px-2 py-1">{{user.profile.phone }}</td>
                  </tr>
                  <tr>
                    <th class="px-2 py-1" scope="row">Address</th>
                    <td class="px-2 py-1">{{user.profile.address}}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="w-full md:w-1/3 px-2">
              <img
                class="rounded border border-gray-300 p-1 max-w-full h-auto"
                src="{{user.profile.image.url}}"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--End Table-->
{% endblock %}
